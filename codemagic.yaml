workflows:
  guuri-android-workflow:
    name: GUURI Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - default
      vars:
        PACKAGE_NAME: "com.guuri.guuri_app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Create Android platform files (if missing)
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.guuri
          fi
      - name: Push Android platform files to GitHub (if newly created)
        script: |
          if [ -d "android" ]; then
            git config user.email "codemagic-bot@guuri.app"
            git config user.name "Codemagic Bot"
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/asad510091-alt/GUURI-APP-.git
            git add android
            if ! git diff --cached --quiet; then
              git commit -m "Add generated Android platform files [skip ci]"
              git push origin HEAD:${CM_BRANCH}
            fi
          fi
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - asad510091@gmail.com
        notify:
          success: true
          failure: true
